name: Institutional Research and Academic Career Development Awards
short: IRACDA
providers: [National Institute of General Medical Sciences]
sponsor_type: Federally funded program
funding_note: NIH's National Institute of General Medical Sciences funds IRACDA programs (K12 awards) at research universities, each partnered with teaching-focused institutions.
type: postdoc
audiences: [Graduate students and postdocs]
career: [New or early-career]
disciplines: [Bioscience]
format: in person
cost: stipend
cost_note: A salaried postdoctoral position, usually for three years.
institutions: Each IRACDA program hires its own postdocs; apply to the programs directly.
url: https://spire.unc.edu/links/special-iracda-program-grantees/
frequency: irregular
schedule: Each program recruits on its own schedule, often in winter and spring for positions starting in the summer or fall.
summary: Postdocs in the biomedical sciences combine mentored research at a research university (about 75% of their time) with mentored teaching at a partner college with a diverse student body, preparing for careers that combine research and teaching.
checked: 2026-11-12
notes: The link is a list of IRACDA programs kept by UNC's SPIRE program. Check that NIGMS still funds new IRACDA awards; some programs (e.g. KU) pause hiring between cohorts.
