name: Consortium for Faculty Diversity Teaching Fellowships
short: CFD
providers: [Consortium for Faculty Diversity at Liberal Arts Colleges]
sponsor_type: Private foundation or nonprofit
funding_note: A consortium of liberal arts colleges, founded in 1987 with funding from the Mellon Foundation; now coordinated by Providence College.
type: postdoc
audiences: [Graduate students and postdocs]
career: [New or early-career]
format: in person
cost: stipend
cost_note: Fellows are paid like full-time visiting faculty; postdoctoral fellows teach up to 60% of a full-time load, with mentoring on teaching and scholarship.
institutions: One application is shared with member colleges, which contact applicants who match their openings. Open to US citizens and permanent residents.
url: https://arts-sciences.providence.edu/consortium-for-faculty-diversity-application-process/
frequency: annual
schedule: Applications for the next academic year open each August (August 1, 2026 for 2026-27 appointments) and are reviewed as colleges fill positions.
summary: One- and two-year dissertation and postdoctoral teaching fellowships at member liberal arts colleges, in all fields including the sciences, for scholars who want a career at a teaching-focused college.
