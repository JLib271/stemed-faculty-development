name: Publish the redirect

# This site moved to https://jlib271.github.io/stemed-professional-development/
# Every day, publish a page that sends visitors there, plus copies of the combined site's calendar and RSS so
# existing subscriptions keep working. Settings -> Pages -> Source stays: GitHub Actions.

on:
  schedule:
    - cron: "47 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy the combined site's calendar and RSS
        continue-on-error: true
        run: |
          mkdir -p site/feeds
          curl -fsSL https://jlib271.github.io/stemed-professional-development/feeds/deadlines.ics -o site/feeds/deadlines.ics
          curl -fsSL https://jlib271.github.io/stemed-professional-development/feeds/new.xml -o site/feeds/new.xml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
