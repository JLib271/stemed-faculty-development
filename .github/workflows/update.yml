name: Check and publish

# Every day: refresh the shared disciplines, run the tests, check the listings in programs/,
# and publish the site to GitHub Pages (offerings whose dates have all passed drop off each day).
# Pull requests only run the checks. Turn on once: Settings -> Pages -> Source: GitHub Actions.

on:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh shared disciplines from HuMeta
        run: python -m stemed_fd.stemedplus_disciplines --refresh
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check the listings in programs/
        run: python -m stemed_fd --validate

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Refresh shared disciplines from HuMeta
        run: python -m stemed_fd.stemedplus_disciplines --refresh
      - name: Build the site
        run: python -m stemed_fd --out output --previous "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output
      - id: deployment
        uses: actions/deploy-pages@v5
